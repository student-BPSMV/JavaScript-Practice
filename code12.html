<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Document</title>
  
</head>
<body class="bg-gray-100">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    .font-poppins {
        font-family: 'Poppins', sans-serif;
    }
</style>

<h1 class="text-4xl font-bold text-slate-800 text-center mb-2 font-poppins mt-15">Re<span class="text-orange-400 font-normal">z</span>taurant</h1>
<p class="text-slate-600 mb-10 font-poppins text-center">Explore the latest additions to our menu.</p>
<section class="flex flex-wrap items-center justify-center gap-6" id="content">
   
</section>
 <button class="text-white bg-orange-400 text-lg font-medium flex justify-center items-center border rounded-lg py-2 px-5 mx-auto gap-2 mt-10 mb-10">Order Now <i class="fa-solid fa-arrow-right"></i></button>
    
    <script>
    let content = document.querySelector("#content");
   
    async function loadedValue(){
        try{
            for(let i = 1 ; i <= 12 ; i++ ){
                const response = await fetch(`https://dummyjson.com/recipes/${i}`);
                if(!response.ok){
                    throw new Error("Server Error");
                }
                const data = await response.json();
                content.innerHTML += `<div>
                    <img class='rounded-full w-full group-hover:shadow-xl hover:-translate-y-0.5 duration-300 transition-all h-72 object-cover object-top' src="${data.image}"></img>
                    <div class="mt-4 font-serif mb-7">
                         <h3 class="font-bold text-lg text-center">${data.name}</h3>
                         <div class="flex justify-center items-center gap-7">
                            <h2 class="text-sm font-medium text-slate-600">Rating:<span class="text-orange-500"> ${data.rating}</span></h2>
                            <h2 class="text-sm font-medium text-slate-600">Price: <span class="text-orange-500">$${data.userId}</span></h2>
                            </div>

                        </div>
                   
                </div>`
            }
           
            console.log(data)
        }catch(err){
            console.log(err.message);
        }
    };

    loadedValue();
    </script>
</body>
</html>
