<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STOPWATCH</title>

    <link rel="stylesheet" href="Stopwatch.css">
</head>

<body>

    <!-- From Uiverse.io by chase2k25 -->
    <div class="container">

        <input type="radio" name="view" id="v1" checked="">
        <input type="radio" name="view" id="v2">
        <input type="radio" name="view" id="v3">
        <input type="radio" name="view" id="v4">
        <input type="radio" name="view" id="v5">

        <div class="watch-container">

            <div class="strap top"></div>
            <div class="strap bottom"></div>

            <div class="watch-case">

                <div class="pusher p-top"></div>
                <div class="pusher p-bottom"></div>

                <div class="main-crown"></div>

                <div class="display-unit">

                    <div class="bezel-ring"></div>

                    <div class="view-wrapper">

                        <div class="view">

                            <div class="complication-arc">
                                <div class="arc-fill"></div>
                            </div>

                            <div class="solar-time">

                                <span id="day">Wednesday</span>

                                <div class="h2 time">
                                    16:45:36
                                </div>

                                <div
                                    style="
                                        font-weight: 700;
                                        color: var(--text-dim);
                                        font-size: 12px;
                                        margin-top: 5px;
                                    "
                                    id="date"
                                >
                                    JAN 07
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- From Uiverse.io by absoluteSTrange -->
    <div class="button-group">

        <button class="start" id="startBtn">Start</button>

        <button id="stopBtn">Stop</button>

        <button class="reset" id="resetBtn">Reset</button>

    </div>

    <script>
        let timeHeading = document.querySelector(".time");
        let StartBtn = document.querySelector("#startBtn");
        let StopBtn = document.querySelector("#stopBtn");
        let ResetBtn = document.querySelector("#resetBtn");
        let dateHeading = document.querySelector("#date");
        let dayHeading = document.querySelector("#day");

        let startInterval;
        function startWatch() {
            startInterval = setInterval(() => {
                let time = new Date().toLocaleTimeString();
                timeHeading.innerText = time;
            }, 1000);
        };

        function stopWatch() {
            clearInterval(startInterval);
        };

        function resetWatch(){
            timeHeading.innerText = "00:00:00";
        };

        function changeDay() {
            let dayNum = new Date().getDay();
            if(dayNum === 1){
                dayHeading.innerText = "Monday";
            }else if(dayNum === 2){
                dayHeading.innerText = "Tuesday";
            }else if(dayNum === 3){
                dayHeading.innerText = "Wednesday";
            }else if(dayNum === 4){
                dayHeading.innerText = "Thursday";
            }else if(dayNum === 5){
                dayHeading.innerText = "Friday";
            }else if(dayNum === 6){
                dayHeading.innerText = "Satday";
            }else{
                dayHeading.innerText = "Sunday";
            }
        };

        function changeDate(){
            let date = new Date().getDate();
            dateHeading.innerText = `Date :  ${date}`; 
        };

        StartBtn.addEventListener("click" , startWatch);
        StopBtn.addEventListener("click" , stopWatch);
        ResetBtn.addEventListener("click" , resetWatch);
        changeDay();
        changeDate();

    </script>
</body> 
</html>
